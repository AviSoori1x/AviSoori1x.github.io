<figure class="fig" id="w-pipeline">
  <figcaption class="fig-head"><span class="fig-kicker">INTERACTIVE</span> <span class="fig-title">Four stages, one corpus</span></figcaption>

  <div class="pl-body">

    <div class="pl-rail" id="w-pipeline-rail" role="tablist" aria-label="Data pipeline stages">

      <button type="button" class="pl-stage" role="tab" id="w-pipeline-tab-0" data-stage="0"
              aria-selected="true" aria-controls="w-pipeline-panel" tabindex="0">
        <span class="pl-markrow"><span class="pl-num">01</span><span class="pl-line"></span></span>
        <span class="pl-sec">Section 3.1</span>
        <span class="pl-name">Template-based unification</span>
        <span class="pl-role">Public datasets with incompatible taxonomies, collapsed into one format.</span>
        <span class="pl-feeds" id="w-pipeline-feeds-0"></span>
      </button>

      <button type="button" class="pl-stage" role="tab" id="w-pipeline-tab-1" data-stage="1"
              aria-selected="false" aria-controls="w-pipeline-panel" tabindex="-1">
        <span class="pl-markrow"><span class="pl-num">02</span><span class="pl-line"></span></span>
        <span class="pl-sec">Section 3.2</span>
        <span class="pl-name">Contrastive curation</span>
        <span class="pl-role">Same content, varied query. Positives and negatives from what exists.</span>
        <span class="pl-feeds" id="w-pipeline-feeds-1"></span>
      </button>

      <button type="button" class="pl-stage" role="tab" id="w-pipeline-tab-2" data-stage="2"
              aria-selected="false" aria-controls="w-pipeline-panel" tabindex="-1">
        <span class="pl-markrow"><span class="pl-num">03</span><span class="pl-line"></span></span>
        <span class="pl-sec">Section 3.3</span>
        <span class="pl-name">Contrastive generation</span>
        <span class="pl-role">An LLM generates the near-miss pairs public data does not contain.</span>
        <span class="pl-feeds" id="w-pipeline-feeds-2"></span>
      </button>

      <button type="button" class="pl-stage" role="tab" id="w-pipeline-tab-3" data-stage="3"
              aria-selected="false" aria-controls="w-pipeline-panel" tabindex="-1">
        <span class="pl-markrow"><span class="pl-num">04</span><span class="pl-line pl-line-end"></span></span>
        <span class="pl-sec">Section 3.4</span>
        <span class="pl-name">Image data processing</span>
        <span class="pl-role">Unsafe images cannot simply be generated, so diversity moves onto the query.</span>
        <span class="pl-feeds" id="w-pipeline-feeds-3"></span>
      </button>

    </div>

    <div class="pl-panel" id="w-pipeline-panel" role="tabpanel" tabindex="0" aria-labelledby="w-pipeline-tab-0"></div>

    <div class="pl-out">
      <div class="pl-out-head">
        <span class="pl-lab">Resulting corpus</span>
        <span class="pl-total" id="w-pipeline-total"></span>
      </div>

      <svg class="pl-bar" id="w-pipeline-bar" role="img" aria-labelledby="w-pipeline-barlab"></svg>
      <span class="pl-sr" id="w-pipeline-barlab"></span>

      <ul class="pl-legend" id="w-pipeline-legend"></ul>

      <p class="pl-ratio" id="w-pipeline-ratio"></p>
    </div>

  </div>

  <p class="fig-note">Open a stage to see its mechanism, and watch which slice of the corpus that stage feeds.</p>
</figure>
