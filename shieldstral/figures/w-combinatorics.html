<figure class="fig" id="w-combinatorics">
  <figcaption class="fig-head"><span class="fig-kicker">INTERACTIVE</span> <span class="fig-title">One sample, many training views</span></figcaption>

      <div class="wc-ctrls">

        <button type="button" class="wc-roll wc-roll-2" id="w-combinatorics-roll10">Roll 10 times</button>
        <button type="button" class="wc-roll wc-roll-2" id="w-combinatorics-reset">Clear coverage</button>

    </div>

    <div class="wc-slots" id="w-combinatorics-slots">

      <div class="wc-slot" id="w-combinatorics-slot-0">
        <span class="wc-lab">&lt;Instruct&gt; strictness<span class="wc-pin" id="w-combinatorics-pin0">set per dataset</span></span>
        <span class="wc-val" id="w-combinatorics-v0"></span>
        <span class="wc-sub" id="w-combinatorics-s0"></span>
      </div>

      <div class="wc-slot" id="w-combinatorics-slot-1">
        <span class="wc-lab">&lt;Document&gt; format family<span class="wc-pin" id="w-combinatorics-pin1">resampled per sample</span></span>
        <span class="wc-val" id="w-combinatorics-v1"></span>
        <span class="wc-sub" id="w-combinatorics-s1"></span>
      </div>

      <div class="wc-slot" id="w-combinatorics-slot-2">
        <span class="wc-lab">&lt;Query&gt; phrasing<span class="wc-pin" id="w-combinatorics-pin2">resampled per sample</span></span>
        <span class="wc-val wc-val-q" id="w-combinatorics-v2"></span>
        <span class="wc-sub" id="w-combinatorics-s2"></span>
      </div>

    <div class="wc-view">

      <div class="wc-field" id="w-combinatorics-f-query"><span class="wc-tag">&lt;Query&gt;</span><span class="wc-txt" id="w-combinatorics-query"></span></div>

    <div class="wc-cov">
      <div class="wc-cov-head">
        <span class="wc-lab">Coverage of the grid shown here</span>
        <span class="wc-count" id="w-combinatorics-count"></span>

        <span class="wc-key-i"><span class="wc-sw wc-sw-seen"></span>drawn at least once</span>
        <span class="wc-key-i"><span class="wc-sw wc-sw-now"></span>current draw</span>

  </div>

  <p class="fig-note">Roll a few times. The surface of the prompt keeps moving, the content underneath and the answer do not. The paper's stated reason for doing this is to keep the model robust when an operator rewords their policy, rather than tying it to one house style of prompt.</p>
