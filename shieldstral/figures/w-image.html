<figure class="fig" id="w-image">
  <figcaption class="fig-head"><span class="fig-kicker">INTERACTIVE</span> <span class="fig-title">Image data: mutate the query, not the picture</span></figcaption>

  <div class="wi-grid">

    <section class="wi-col" aria-labelledby="w-image-lab-pools">
      <span class="wi-lab" id="w-image-lab-pools">Three source pools</span>
      <div class="wi-pools" id="w-image-pools" role="group" aria-label="Source pools"></div>
      <div class="wi-map" id="w-image-map"></div>
    </section>

    <section class="wi-col" aria-labelledby="w-image-lab-query">
      <span class="wi-lab" id="w-image-lab-query">Query mutation</span>
      <ul class="wi-stats" id="w-image-stats"></ul>
      <div class="wi-framing" id="w-image-framing" role="group" aria-label="Query framing"></div>
      <div class="wi-qcard" id="w-image-qcard"></div>
    </section>

  </div>

  <section class="wi-rr" aria-labelledby="w-image-lab-rr">

    <div class="wi-rr-head">
      <span class="wi-lab" id="w-image-lab-rr">Vision-language reranker <span class="wi-tag">schematic</span></span>
      <div class="wi-modes" id="w-image-modes" role="group" aria-label="Reranker options"></div>
    </div>

    <div class="wi-lanes">

      <div class="wi-lane" id="w-image-lane-v">
        <div class="wi-lane-head">
          <span class="wi-lane-name">Violation pool <span class="wi-lane-sub">rare</span></span>
          <span class="wi-lane-counts" id="w-image-counts-v"></span>
        </div>
        <svg class="wi-plot" id="w-image-plot-v" viewBox="0 0 400 64" role="img" aria-labelledby="w-image-plotlab-v"></svg>
        <span class="wi-sr" id="w-image-plotlab-v"></span>
        <div class="wi-ctl">
          <label class="wi-ctl-lab" for="w-image-th-v">Lenient cut</label>
          <input class="wi-range" type="range" id="w-image-th-v" min="0" max="100" step="1" value="40" aria-label="Keep threshold for the violation pool">
          <output class="wi-ctl-val" id="w-image-thval-v" for="w-image-th-v"></output>
        </div>
      </div>

      <div class="wi-lane" id="w-image-lane-n">
        <div class="wi-lane-head">
          <span class="wi-lane-name">Negative pools <span class="wi-lane-sub" id="w-image-lane-sub-n">abundant</span></span>
          <span class="wi-lane-counts" id="w-image-counts-n"></span>
        </div>
        <svg class="wi-plot" id="w-image-plot-n" viewBox="0 0 400 64" role="img" aria-labelledby="w-image-plotlab-n"></svg>
        <span class="wi-sr" id="w-image-plotlab-n"></span>
        <div class="wi-ctl">
          <label class="wi-ctl-lab" for="w-image-th-n">Strict cut</label>
          <input class="wi-range" type="range" id="w-image-th-n" min="0" max="100" step="1" value="70" aria-label="Keep threshold for the negative pools">
          <output class="wi-ctl-val" id="w-image-thval-n" for="w-image-th-n"></output>
        </div>
      </div>

    </div>

    <div class="wi-axis">
      <span>0.00</span>
      <span class="wi-axis-mid">image and query agreement score</span>
      <span>1.00</span>
    </div>

    <ul class="wi-legend">
      <li><svg class="wi-key" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.2 L10.2 9.6 L1.8 9.6 Z" class="wi-key-v"></path></svg>Violation sample</li>
      <li><svg class="wi-key" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.1" class="wi-key-n"></circle></svg>Negative sample</li>
      <li><svg class="wi-key" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.6 L10.4 6 L6 10.4 L1.6 6 Z" class="wi-key-h"></path></svg>Generated hard negative</li>
      <li class="wi-legend-note">Filled: kept. Outline: dropped.</li>
    </ul>

    <p class="wi-readout" id="w-image-readout" aria-live="polite"></p>

  </section>

  <div class="wi-out" id="w-image-out"></div>

  <p class="fig-note">Pull the two cut lines apart. The lenient cut on the rare pool rescues samples that one strict cut would throw away, while the strict cut removes more of the abundant negatives, where samples are plentiful.</p>
</figure>
