<figure class="fig" id="w-ablation">
  <figcaption class="fig-head"><span class="fig-kicker">INTERACTIVE</span> <span class="fig-title">What each training stage buys</span></figcaption>

  <div class="wa-body">

    <div class="wa-controls">
      <span class="wa-lab" id="w-ablation-metric-lab">metric</span>
      <div class="wa-seg" id="w-ablation-seg" role="radiogroup" aria-labelledby="w-ablation-metric-lab"></div>
      <span class="wa-set">fine-grained taxonomy validation set</span>
    </div>

    <div class="wa-chart" id="w-ablation-chart"></div>

    <div class="wa-axis" id="w-ablation-axis">
      <div class="wa-scale" id="w-ablation-scale" aria-hidden="true"></div>
    </div>

    <ul class="wa-legend">
      <li><span class="wa-sw wa-sw-base" aria-hidden="true"></span>level carried in</li>
      <li><span class="wa-sw wa-sw-gain" aria-hidden="true"></span>gain, solid</li>
      <li><span class="wa-sw wa-sw-loss" aria-hidden="true"></span>loss, hatched</li>
    </ul>

    <div class="wa-read">
      <p class="wa-callout" id="w-ablation-callout"></p>
      <p class="wa-line" id="w-ablation-line" aria-live="polite"></p>
      <p class="wa-foot" id="w-ablation-foot"></p>
    </div>

  </div>

  <p class="fig-note">Switch the metric to watch the trade. Public data alone buys precision but very little recall on a taxonomy the model never saw. The generated taxonomy data flips that, adding recall at a cost in precision. Merging the two checkpoints is what gets a high score on both at once, on this validation set, though it does hand back some recall.</p>
</figure>
