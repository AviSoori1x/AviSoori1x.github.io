<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ page_desc }}">
<link rel="canonical" href="{{ site.url }}{{ canonical }}">
<meta name="author" content="{{ site.name }}">

<meta property="og:type" content="{{ og_type|default('website') }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_desc }}">
<meta property="og:url" content="{{ site.url }}{{ canonical }}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:image" content="{{ site.url }}/{{ site.og_image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:creator" content="@{{ site.twitter }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ rel }}assets/main.css">
<link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.url }}/feed.xml">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23faf7f1%22/><text y=%22.9em%22 x=%22.06em%22 font-size=%2286%22 font-family=%22Georgia,serif%22 fill=%22%23c3341a%22>A</text></svg>">
{% if json_ld %}<script type="application/ld+json">{{ json_ld|safe }}</script>{% endif %}
</head>
<body>
<div class="spine" aria-hidden="true"></div>
<div class="page">
{% block content %}{% endblock %}
<footer class="colophon">
  <span>© {{ site.year }} {{ site.name }}</span>
  <span>
    {%- for l in site.links %}<a href="{{ l.url }}">{{ l.label }}</a>{% if not loop.last %} &nbsp;·&nbsp; {% endif %}{% endfor -%}
  </span>
  <span>Set in Instrument Serif &amp; IBM Plex Mono</span>
</footer>
</div>
</body>
</html>
