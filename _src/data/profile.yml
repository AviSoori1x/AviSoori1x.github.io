profile:
  role: Research Scientist
  org: Mistral AI
  location: San Francisco
  headshot: images/avi.jpg
  headshot_alt: Avinash Sooriyarachchi
  standfirst: >-
    I do robotics foundation model research at Mistral. Mostly vision-language-action
    policies, and the simulated environments we use both to train them and to work out
    whether they're any good. I've been working in deep learning since 2017, and I led
    the US applied science team here before moving to research.
  meta_desc: >-
    Avinash Sooriyarachchi is a Research Scientist at Mistral AI working on robotics
    foundation models, vision-language-action policies and real-to-sim evaluation.
    He wrote makeMoE and seemore.
  contact: >-
    LinkedIn is the most reliable way to reach me. Most of what I build ends up on
    GitHub sooner or later, and the papers are on Scholar.

now:
  headline: Robotics foundation models, and the simulation they train and get tested in
  paragraphs:
    - >-
      Most of my time goes to vision-language-action models, and to the System-2 planner
      sitting above them that has to break a long instruction into steps a policy can
      execute. Neither has the high-quality training data it needs in the form it's needed,
      so I build a lot of that too.
    - >-
      A lot of it comes down to real-to-sim. I build pipelines that take a single real
      camera frame and rebuild it as a physically valid simulated scene, and those scenes
      get used two ways. As a post-training environment, a policy can collect experience
      that would be slow or expensive to gather on real hardware. As an eval harness, you
      can run a policy a hundred times and score it, instead of filming one good demo and
      calling it a result.
    - >-
      Robotics isn't the only thing I work on here. I was a lead contributor on
      Shieldstral, a multimodal safety classifier, and on Mistral Small Creative. Before
      any of it I worked on NLP, recommender systems and multimodal models, going back
      to 2017.
