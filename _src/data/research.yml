note: >-
  Mistral ships models as collectively authored technical reports. I've marked the ones
  where I'm in the core author block.

items:
  - title: Shieldstral
    venue: arXiv preprint
    date: "2026"
    sort: "2026-07-28"
    url: https://arxiv.org/abs/2607.25857
    role: Core author
    note: >-
      A 3B multimodal safety classifier that matches or beats models around seven times its
      size on text safety, and sets state of the art on multimodal. Instead of scoring
      against a fixed taxonomy, it asks whether content violates the policy you hand it.

  - title: Robostral Navigate
    venue: arXiv preprint
    date: "2026"
    sort: "2026-07-22"
    url: https://arxiv.org/abs/2607.20785
    role: Core author
    note: >-
      An 8B vision-language navigation model that works from a single RGB camera. It picks
      waypoints by pointing at the next target in the current view, so everything happens in
      image space instead of a robot-specific action space.

  - title: Voxtral TTS
    venue: arXiv preprint
    date: "2026"
    sort: "2026-03-26"
    url: https://arxiv.org/abs/2603.25551
    role: Mistral AI
    note: >-
      Expressive multilingual text to speech. It clones a voice from as little as three
      seconds of reference audio, using autoregressive semantic tokens plus flow matching
      for the acoustics.

  - title: Voxtral Realtime
    venue: arXiv preprint
    date: "2026"
    sort: "2026-02-11"
    url: https://arxiv.org/abs/2602.11298
    role: Mistral AI
    note: >-
      Streaming speech recognition that holds offline transcription quality at sub-second
      latency. Trained end to end for streaming, with explicit alignment between the audio
      and text streams.

  - title: Ministral 3
    venue: arXiv preprint
    date: "2026"
    sort: "2026-01-13"
    url: https://arxiv.org/abs/2601.08584
    role: Mistral AI
    note: >-
      Dense models at 3B, 8B and 14B. Each one ships as a base, an instruction-tuned and a
      reasoning variant, all of them with image understanding, all Apache 2.0.

  - title: Fiber Based Approaches as Medicine Delivery Systems
    venue: ACS Biomaterials Science & Engineering 2(9)
    date: "2016"
    sort: "2016-08-02"
    url: https://doi.org/10.1021/acsbiomaterials.6b00281
    role: Co-first author
    note: >-
      A review of micro- and nanofibers as drug carriers, covering electrospinning,
      microfluidic, wet-spinning, rotary and self-assembly fabrication. This came out of my
      mechanical engineering research at Iowa State, and it's still my most cited paper.
