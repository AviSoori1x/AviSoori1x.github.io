items:
  - title: Empowering Generative AI with Databricks and AMD
    venue: Data + AI Summit
    date: "2024"
    sort: "2024-06"
    kind: Talk
    url: https://youtu.be/FB6H4NwFGzQ
    note: >-
      Running generative AI workloads on AMD accelerators inside Databricks, and what it
      takes to make a non-NVIDIA stack practical.

  - title: "Text to Insights: Building Real-Time Analytics Systems with Generative AI"
    venue: ODSC Generative AI Summit
    date: "2023"
    sort: "2023-10"
    kind: Talk
    url: https://youtu.be/yJ0ywuG_yv4?t=12880
    note: >-
      Wiring language models, vector databases and efficient fine-tuning into something that
      turns a plain-English question into a live analytical answer.

  - title: "Getting Up to Speed on Real-Time Machine Learning"
    venue: ODSC Europe
    date: "2023"
    sort: "2023-06"
    kind: Talk
    url: https://youtu.be/eJqqDZkBrzE
    note: >-
      What people actually mean by "real time" across streaming inference, feature freshness
      and online learning, and which parts are worth paying for.

  - title: "Monetizing Data Assets: Sharing Data, Models and Features"
    venue: Data + AI Summit
    date: "2023"
    sort: "2023-06"
    kind: Talk
    url: https://youtu.be/wj_WtrrEfi8
    note: >-
      Treating models and feature tables as shareable, governed products instead of artifacts
      locked inside one team's workspace.

  - title: Streaming Machine Learning with Databricks and GitHub Actions
    venue: GitHub Universe
    date: "2022"
    sort: "2022-11"
    kind: Talk
    url: https://youtu.be/ogk__G33E-A
    note: >-
      Continuous delivery for streaming ML. Model training and deployment driven from CI on a
      structured streaming pipeline.

  # One talk, given twice. `also` keeps the second delivery on the same entry
  # instead of listing the talk again.
  - title: Innovating with Multimodality and Reasoning with Mistral AI
    venue: ODSC West
    date: "2024"
    sort: "2024-10-31"
    kind: Talk
    url: https://odsc.com/speakers/innovating-with-multimodality-and-reasoning-with-mistral-ai/
    also:
      - label: AWS GenAI Developer Day, San Francisco
        url: https://www.aicamp.ai/event/eventdetails/W2024101509
    note: >-
      Where multimodal input and explicit reasoning change what you can build on a foundation
      model. Given in the "What's Next in AI" track, and again for a developer audience at the
      AWS SF Loft with AICamp.
