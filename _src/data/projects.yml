items:
  - name: makeMoE
    featured: true
    stars: 812
    url: https://github.com/AviSoori1x/makeMoE
    desc: >-
      A sparse mixture-of-experts language model I wrote from scratch in pure PyTorch, in
      the spirit of Karpathy's makemore. The expert modules are the easy part. Most of the
      work went into the noisy top-k gating and the initialization, which are what decide
      whether an MoE trains at all. Meant as a readable reference for the architecture
      behind Mixtral, DBRX and Grok.
    adoption: >-
      The NeurIPS 2024 tutorial on dynamic sparsity builds its mixture-of-experts notebook
      on this, says so in the notebook, and trains on data pulled straight from the repo.
      The M2L Summer School 2024 lists it as assigned reading.
    links:
      - label: Repository
        url: https://github.com/AviSoori1x/makeMoE
      - label: Write-up
        url: https://huggingface.co/blog/AviSoori1x/makemoe-from-scratch
      - label: NeurIPS 2024 tutorial
        url: https://dynamic-sparsity.github.io/assets/notebooks/moes.ipynb
      - label: M2L Summer School
        url: https://github.com/M2Lschool/tutorials2024/blob/main/1_nlp/part_II_text_generation/Transformer_Decoder_MoE_solved.ipynb
      - label: Hacker News
        url: https://news.ycombinator.com/item?id=39742921

  - name: seemore
    featured: true
    stars: 260
    url: https://github.com/AviSoori1x/seemore
    desc: >-
      Same idea as makeMoE, pointed at vision. A ViT image encoder feeds a multimodal
      projection module and a character-level autoregressive decoder, wired end to end so you
      can step through the whole thing. A follow-up,
      seeMoE, swaps the decoder for a mixture-of-experts version.
    adoption: >-
      École Polytechnique's graduate course CSC_52002 uses its architecture diagram as the
      reference VLM diagram in Lab 1.
    links:
      - label: Repository
        url: https://github.com/AviSoori1x/seemore
      - label: seemore write-up
        url: https://huggingface.co/blog/AviSoori1x/seemore-vision-language-model
      - label: seeMoE write-up
        url: https://huggingface.co/blog/AviSoori1x/seemoe
      - label: École Polytechnique lab
        url: https://github.com/ArnaudoB/CSC_52002_EP-MultimodalGenAI/blob/main/lab1/lab1.ipynb

  - name: Tuning the Finetuning
    stars: 46
    url: https://github.com/AviSoori1x/Tuning-the-Finetuning
    desc: >-
      An empirical look at what matters when fine-tuning with QLoRA. The short version is
      that you should target every linear layer, not just the attention blocks, and that a
      modest rank is enough.
    links:
      - label: Repository
        url: https://github.com/AviSoori1x/Tuning-the-Finetuning
      - label: LoRA guide
        url: https://www.databricks.com/blog/efficient-fine-tuning-lora-guide-llms

  - name: multimodal_LLMs
    stars: 12
    url: https://github.com/AviSoori1x/multimodal_LLMs
    desc: >-
      Fine-tuning BLIP-2 and Flan-T5-XL for caption generation with PEFT/LoRA. An early look
      at parameter-efficient adaptation of multimodal models.

