items:
  - when: 2024 to now
    role: Research Scientist
    org: Mistral AI
    note: >-
      Robotics foundation models, mostly manipulation and navigation. Contributor on the
      Robostral Navigate release, and a lead contributor on Shieldstral and Mistral Small
      Creative. I joined in 2024 on the applied side and led the US applied science team
      before moving to research.
    links:
      - label: Robostral Navigate
        url: https://arxiv.org/abs/2607.20785
      - label: Shieldstral
        url: https://arxiv.org/abs/2607.25857
      - label: Mistral Small Creative
        url: https://docs.mistral.ai/models/mistral-small-creative-25-12

  - when: 2021 to 2024
    role: Senior Solutions Architect, AI/ML
    org: Databricks
    note: >-
      Field engineering, and for the last stretch retail and consumer packaged goods in the
      Bay Area. LLM fine-tuning, recommender systems, vector search and streaming ML. Most
      of my writing and conference talks come from this period.

  - when: 2019 to 2021
    role: Senior Solutions Architect, AI/ML
    org: SAS
    note: >-
      Applied machine learning on SAS Viya in Cary, North Carolina. Explainability, NLP
      services and model deployment. I led the AutoML prototype team.

  - when: 2018 to 2019
    role: Founder & Lead Data Scientist
    org: RandomWalk Technologies
    note: >-
      I built Fora, a conversational analytics engine that answered plain-English questions
      about social media data. Ames, Iowa, out of the ISU Startup Factory.

  - when: 2016 to 2017
    role: M.S.E., Mechanical Engineering and Applied Mechanics
    org: University of Pennsylvania
    note: >-
      Started as a PhD student in Jordan Raney's Architected Materials Lab, researching
      mechanical metamaterials on a Dean's Research Fellowship, with coursework in numerical
      methods and computational mechanics. I left with a master's after getting into machine
      learning. Wharton's Modern Data Mining course was the turning point.

  - when: 2016
    role: B.S., Mechanical Engineering
    org: Iowa State University
    note: >-
      Undergraduate research in bio-microfluidics with Nastaran Hashemi. That work became a
      co-first author review in ACS Biomaterials Science & Engineering.
